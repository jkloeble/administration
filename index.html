        // AB HIER: TECHNIK – normalerweise musst du hier nichts mehr ändern.
        // ═══════════════════════════════════════════════════════════════════════════

        // ── Startseite aufbauen (Texte kommen aus PHASE 0 oben) ──
        function buildHero() {
            const vp = document.getElementById('slide-viewport');
            const h = phases[0];
            const hero = document.createElement('div');
            hero.className = 'hero-slide active';
            hero.id = 'slide-0';
            const phaseLabels = phases.slice(1).map(p => p.label); // Zeitleiste aus den Kurznamen der Phasen
            hero.innerHTML = `
    <div class="hero-inner">
      <h1 class="hero-title"><span class="ki">${h.titleLine1}</span><em>${h.titleLine2}<span class="dot-gold">.</span></em></h1>
      <p class="hero-subtitle">${h.subtitle}</p>
      <div class="hero-phases">
        ${phaseLabels.map((label, i) => `
          <div class="hero-phase-item">
            <div class="hero-phase-dot ${i === 0 ? 'first' : ''}" style="--i:${i}"></div>
            <div class="hero-phase-label">${label}</div>
          </div>
          ${i < phaseLabels.length - 1 ? '<div class="hero-phase-line"></div>' : ''}
        `).join('')}
      </div>
      <button class="hero-cta" onclick="navigate(1)">${h.buttonText}</button>
    </div>`;
            vp.appendChild(hero);
        }

        // ── Folien-Technik ──
        let currentSlide = 0;
        let isAnimating = false;

        function buildSlides() {
            const vp = document.getElementById('slide-viewport');
            const dotNav = document.getElementById('dot-nav');
            dotNav.innerHTML = '';

            const heroDot = document.createElement('div');
            heroDot.className = 'dot active';
            heroDot.setAttribute('data-label', phases[0].label);
            heroDot.onclick = () => goTo(0);
            dotNav.appendChild(heroDot);

            phases.slice(1).forEach((p, i) => {
                const idx = i + 1;
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.id = 'slide-' + idx;
                slide.innerHTML = `
      <div class="slide-left">
        <div class="slide-bg-num">${idx}</div>
        <div class="slide-eyebrow">${p.eyebrow}</div>
        <h2 class="slide-title">${p.title}</h2>
        <p class="slide-intro">${p.intro}</p>
      </div>
      <div class="slide-right" id="slide-right-${idx}"></div>`;
                vp.appendChild(slide);
                slide.querySelector('.slide-right').innerHTML = p.render();

                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.setAttribute('data-label', p.label);
                dot.onclick = () => goTo(idx);
                dotNav.appendChild(dot);
            });

            updateUI();
            renderStepper();
        }

        function goTo(idx) {
            if (idx === currentSlide || isAnimating) return;
            if (idx < 0 || idx >= phases.length) return;
            isAnimating = true;
            const dir = idx > currentSlide ? 1 : -1;

            const numEl = document.getElementById('transition-num');
            numEl.textContent = idx;
            numEl.style.transition = 'none';
            numEl.style.opacity = '0';
            numEl.style.transform = 'translateY(15px)';
            requestAnimationFrame(() => {
                numEl.style.transition = 'opacity 0.2s ease,transform 0.2s ease';
                numEl.style.opacity = '0.05';
                numEl.style.transform = 'translateY(0)';
                setTimeout(() => {numEl.style.opacity = '0'; numEl.style.transform = 'translateY(-15px)';}, 260);
            });

            const fromEl = document.getElementById('slide-' + currentSlide);
            const toEl = document.getElementById('slide-' + idx);

            fromEl.style.transition = 'opacity 0.35s ease,transform 0.35s cubic-bezier(.4,0,.2,1)';
            fromEl.style.opacity = '0';
            fromEl.style.transform = dir > 0 ? 'translateY(-22px)' : 'translateY(22px)';

            toEl.style.transition = 'none';
            toEl.style.opacity = '0';
            toEl.style.transform = dir > 0 ? 'translateY(22px)' : 'translateY(-22px)';
            toEl.classList.add('active');

            requestAnimationFrame(() => requestAnimationFrame(() => {
                toEl.style.transition = 'opacity 0.38s ease,transform 0.38s cubic-bezier(.4,0,.2,1)';
                toEl.style.opacity = '1';
                toEl.style.transform = 'translateY(0)';
            }));

            setTimeout(() => {
                fromEl.classList.remove('active');
                fromEl.style.transition = fromEl.style.opacity = fromEl.style.transform = '';
                toEl.style.transition = '';
                currentSlide = idx;
                isAnimating = false;
                updateUI();
                // Klick-Anleitung beim Betreten der Phase wieder auf Schritt 1 setzen
                if (toEl.querySelector('#ghStepper')) {stepperIdx = 0; renderStepper();}
                const rp = document.getElementById('slide-right-' + idx);
                if (rp) rp.scrollTop = 0;
            }, 400);
        }

        function navigate(dir) {goTo(currentSlide + dir);}

        function updateUI() {
            document.getElementById('progress-fill').style.width = ((currentSlide + 1) / phases.length * 100) + '%';
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
            const prev = document.getElementById('btn-prev');
            const next = document.getElementById('btn-next');
            const feedback = document.getElementById('btn-feedback');
            prev.disabled = currentSlide === 0;
            if (currentSlide === phases.length - 1) {
                next.textContent = '✓ Fertig';            // ✏️ Text des Buttons auf der letzten Phase
                next.onclick = () => launchConfetti(next);
                if (feedback) feedback.style.display = 'inline-flex';
            } else {
                next.innerHTML = 'Weiter ↓';              // ✏️ Text des Weiter-Buttons
                next.onclick = () => navigate(1);
                if (feedback) feedback.style.display = 'none';
            }
            next.disabled = false;
        }

        // ── Konfetti beim Klick auf "Fertig" ──
        function launchConfetti(btn) {
            const rect = btn.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top;
            // ✏️ Farben der Konfetti-Schnipsel
            const colors = ['#FFBF00', '#6900F4', '#0000F5', '#FFE800', '#3D008D', '#FFFFFF'];
            const count = 48;

            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                const color = colors[Math.floor(Math.random() * colors.length)];
                const size = Math.random() * 7 + 4;
                const isRect = Math.random() > 0.5;
                el.style.cssText = `
      position:fixed; left:${x}px; top:${y}px; width:${size}px; height:${isRect ? size * 0.4 : size}px;
      background:${color}; border-radius:${isRect ? '1px' : '50%'};
      pointer-events:none; z-index:9998; opacity:1;
      transform:rotate(${Math.random() * 360}deg);
    `;
                document.body.appendChild(el);

                const angle = (Math.random() * 160 - 130) * (Math.PI / 180);
                const speed = Math.random() * 180 + 80;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const duration = Math.random() * 800 + 600;
                const startTime = performance.now();

                (function animate(now) {
                    const t = (now - startTime) / duration;
                    if (t >= 1) {el.remove(); return;}
                    const eased = 1 - t;
                    el.style.left = (x + vx * t) + 'px';
                    el.style.top = (y + vy * t + 200 * t * t) + 'px';
                    el.style.opacity = eased;
                    el.style.transform = `rotate(${t * 360 * (Math.random() > 0.5 ? 1 : -1)}deg)`;
                    requestAnimationFrame(animate);
                })(performance.now());
            }
        }

        // ── Steuerung mit Pfeiltasten & Leertaste ──
        document.addEventListener('keydown', e => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
            if (e.key === 'ArrowDown' || e.key === ' ') {e.preventDefault(); navigate(1);}
            else if (e.key === 'ArrowUp') {e.preventDefault(); navigate(-1);}
            else if (e.key === 'ArrowRight') navigate(1);
            else if (e.key === 'ArrowLeft') navigate(-1);
        });

        // ── Kopieren-Button ──
        function copyPrompt(btn, promptId) {
            const text = document.getElementById(promptId)?.textContent || '';
            const finish = () => {
                btn.classList.add('copied');
                btn.innerHTML = `${IC.check}<span>Kopiert!</span>`;   // ✏️ Text nach dem Kopieren
                setTimeout(() => {btn.classList.remove('copied'); btn.innerHTML = `${IC.copy}<span>Kopieren</span>`;}, 2500);
            };
            navigator.clipboard.writeText(text).then(finish).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); finish();
            });
        }

        // ── Seite starten ──
        buildHero();
        buildSlides();

        // ── EIGENER MAUSZEIGER (gelber Punkt) ──
        // ✏️ Zum Entfernen: diesen ganzen Block löschen UND im CSS die Zeile
        //    "* { cursor: none !important; }" löschen.
        const cursorRing = document.createElement('div'); cursorRing.id = 'cursor-ring';
        const cursorDot = document.createElement('div'); cursorDot.id = 'cursor-dot';
        document.body.appendChild(cursorRing);
        document.body.appendChild(cursorDot);
        let mx = -200, my = -200, rx = -200, ry = -200;
        document.addEventListener('mousemove', e => {mx = e.clientX; my = e.clientY;});
        (function animCursor() {
            rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
            cursorRing.style.left = rx + 'px'; cursorRing.style.top = ry + 'px';
            cursorDot.style.left = mx + 'px'; cursorDot.style.top = my + 'px';
            requestAnimationFrame(animCursor);
        })();
        const HOVER_TARGETS = 'button,a,.dot,.accordion-header,.nav-btn,.copy-btn,.next-step-card,.inspo-card,.vocab-card,.tool-card,.alt-card,.quadrant,.flow-step';
        document.addEventListener('mouseover', e => document.body.classList.toggle('cursor-hover', !!e.target.closest(HOVER_TARGETS)));
        document.addEventListener('mousedown', () => document.body.classList.add('cursor-click'));
        document.addEventListener('mouseup', () => document.body.classList.remove('cursor-click'));

        // ── ANIMIERTER PARTIKEL-HINTERGRUND DER STARTSEITE ──
        // Punkte-Raster, das auf die Maus reagiert. Um den Text herum bleibt ein Freiraum,
        // der genau der Form der Schrift folgt; von dort laufen pulsierende Wellen nach außen.
        // ✏️ Zum Entfernen: diesen ganzen Block bis "initHeroCanvas();" löschen.
        function initHeroCanvas() {
            const hero = document.getElementById('slide-0');
            if (!hero) return;
            const canvas = document.createElement('canvas');
            canvas.id = 'hero-canvas';
            hero.prepend(canvas);
            const ctx = canvas.getContext('2d');

            // ── Einstellungen ──
            const GAP = 18;               // Abstand der Punkte im Raster (px)
            const BASE_R = 1.1;           // Größe der Punkte im Ruhezustand
            const MAX_R = 3.4;            // Größe der Punkte direkt am Cursor / in der Welle
            const RADIUS = 60;            // Wirkungsradius um den Cursor (px)
            const SPEED = 0.18;           // Wie schnell Punkte reagieren (0–1)
            const BASE_COLOR = [173, 173, 234]; // Ruhefarbe (#ADADEA)
            const HOT_COLOR = [105, 0, 244];    // Farbe in Welle & am Cursor (#6900F4)
            const CLEAR = 26;             // Freiraum um den Text, in dem keine Punkte sind (px)
            const FADE = 70;              // Breite des weichen Übergangs danach (px)
            const BREATHE = 8;            // Wie stark der Freiraum "atmet" (px)
            const PULSE_EVERY = 3200;     // ✏️ Zeit zwischen zwei Wellen (ms) – passt zum CSS-Pulsieren
            const PULSE_SPEED = 0.32;     // Geschwindigkeit der Welle (px pro ms)
            const PULSE_WIDTH = 55;       // Breite der Welle (px)
            const PULSE_STRENGTH = 0.6;   // Stärke der Welle (0–1)

            let W, H, dots = [], mouse = {x: -9999, y: -9999};
            const dpr = window.devicePixelRatio || 1;

            // Kästen um jede Textzeile (nicht um den ganzen Block) → Freiraum folgt der Schrift
            function textBoxes() {
                const hr = hero.getBoundingClientRect();
                const boxes = [];
                hero.querySelectorAll('.hero-title .ki, .hero-title em, .hero-subtitle, .hero-phase-item, .hero-cta').forEach(el => {
                    const range = document.createRange();
                    range.selectNodeContents(el);
                    const rects = el.classList.contains('hero-cta') || el.classList.contains('hero-phase-item')
                        ? [el.getBoundingClientRect()] : [...range.getClientRects()];
                    rects.forEach(r => r.width && boxes.push({l: r.left - hr.left, t: r.top - hr.top, r: r.right - hr.left, b: r.bottom - hr.top}));
                });
                return boxes;
            }

            function resize() {
                W = hero.offsetWidth; H = hero.offsetHeight;
                canvas.width = W * dpr; canvas.height = H * dpr;
                canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const boxes = textBoxes();
                dots = [];
                const offX = (W % GAP) / 2, offY = (H % GAP) / 2;
                for (let y = offY; y <= H; y += GAP)
                    for (let x = offX; x <= W; x += GAP) {
                        let dist = Infinity;   // Abstand zum nächsten Text
                        for (const b of boxes) {
                            const dx = Math.max(b.l - x, 0, x - b.r), dy = Math.max(b.t - y, 0, y - b.b);
                            dist = Math.min(dist, Math.hypot(dx, dy));
                        }
                        dots.push({x, y, dist, t: 0});   // t = 0 Ruhe, 1 = voll aktiv
                    }
            }

            hero.addEventListener('mousemove', e => {
                const r = hero.getBoundingClientRect();
                mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
            });
            hero.addEventListener('mouseleave', () => {mouse.x = -9999; mouse.y = -9999;});

            function draw(now) {
                requestAnimationFrame(draw);
                if (!hero.classList.contains('active')) return; // Nur zeichnen, wenn die Startseite sichtbar ist
                ctx.clearRect(0, 0, W, H);
                const clear = CLEAR + BREATHE * (0.5 + 0.5 * Math.sin(now / PULSE_EVERY * Math.PI * 2));
                const waveR = (now % PULSE_EVERY) * PULSE_SPEED;
                const waveFade = Math.max(0, 1 - waveR / (PULSE_EVERY * PULSE_SPEED));
                for (const d of dots) {
                    const vis = Math.min(1, Math.max(0, (d.dist - clear) / FADE));
                    if (vis <= 0) continue;
                    const md = Math.hypot(d.x - mouse.x, d.y - mouse.y);
                    const hover = md < RADIUS ? 1 - md / RADIUS : 0;
                    const wave = Math.exp(-(((d.dist - waveR) / PULSE_WIDTH) ** 2)) * waveFade * PULSE_STRENGTH;
                    d.t += (Math.max(hover, wave) - d.t) * SPEED;
                    const c = BASE_COLOR.map((v, i) => Math.round(v + (HOT_COLOR[i] - v) * d.t));
                    ctx.globalAlpha = vis;
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, BASE_R + (MAX_R - BASE_R) * d.t, 0, Math.PI * 2);
                    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            window.addEventListener('resize', resize);
            resize();
            document.fonts.ready.then(resize); // Nach dem Laden der Schriften neu vermessen
            requestAnimationFrame(draw);
        }
        initHeroCanvas();
    </script>
</body>
